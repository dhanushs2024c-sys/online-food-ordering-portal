apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-portal-blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: food-portal
      color: blue
  template:
    metadata:
      labels:
        app: food-portal
        color: blue
    spec:
      containers:
        - name: food-portal
          image: dhan01/online-food-ordering-portal:v1
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-portal-green
spec:
  replicas: 3
  selector:
    matchLabels:
      app: food-portal
      color: green
  template:
    metadata:
      labels:
        app: food-portal
        color: green
    spec:
      containers:
        - name: food-portal
          image: dhan01/online-food-ordering-portal:v1
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: food-portal-service
spec:
  type: NodePort
  selector:
    app: food-portal
    color: blue
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30015
